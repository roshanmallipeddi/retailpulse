name: ci

# Lint and test. Grows with the project: dbt build, Docker build and
# Asset Bundle validation are added in later phases.

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install uv
        run: python -m pip install --upgrade uv

      - name: Lint and format check
        run: |
          if [ ! -f pyproject.toml ]; then
            echo "No Python project yet; skipping lint."
            exit 0
          fi
          uvx ruff check .
          uvx ruff format --check .

      - name: Tests
        run: |
          if [ ! -f pyproject.toml ] || [ ! -d tests ]; then
            echo "No tests yet; skipping."
            exit 0
          fi
          uv sync
          uv run pytest -q
